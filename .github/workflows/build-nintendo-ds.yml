name: Build GUD FNF Nintendo DS
on:
  push:
    branches: [nintendo-ds]
    paths:
      - "Nintendo-DS/**"
      - ".github/workflows/build-nintendo-ds.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify preinstalled Nintendo DS toolchain
        run: |
          test -f /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc
          test -f /opt/devkitpro/libnds/include/nds.h
          test -f /opt/devkitpro/devkitARM/ds_rules
      - name: Compile Nintendo DS ROM
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          make -C Nintendo-DS clean
          make -C Nintendo-DS
      - name: Verify ROM output
        run: |
          test -s Nintendo-DS/GUD_FNF_DS.nds
          ls -lh Nintendo-DS/GUD_FNF_DS.nds
      - name: Upload NDS artifact
        uses: actions/upload-artifact@v4
        with:
          name: GUD-FNF-DS
          path: Nintendo-DS/GUD_FNF_DS.nds
          if-no-files-found: error
