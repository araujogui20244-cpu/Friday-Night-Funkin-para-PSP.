name: Build GUD FNF Nintendo DS

on:
  push:
    branches: [nintendo-ds]
    paths:
      - "Nintendo-DS/**"
      - ".github/workflows/build-nintendo-ds.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nintendo DS development libraries
        run: dkp-pacman -Sy --noconfirm nds-dev

      - name: Compile Nintendo DS ROM
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          make -C Nintendo-DS clean
          make -C Nintendo-DS

      - name: Verify ROM output
        run: |
          test -s Nintendo-DS/GUD_FNF_DS.nds
          file Nintendo-DS/GUD_FNF_DS.nds
          ls -lh Nintendo-DS/GUD_FNF_DS.nds

      - name: Upload NDS artifact
        uses: actions/upload-artifact@v4
        with:
          name: GUD-FNF-DS
          path: Nintendo-DS/GUD_FNF_DS.nds
          if-no-files-found: error
