name: Build GUD FNF PSP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PSP SDL libraries
        run: |
          psp-pacman -Sy --noconfirm sdl sdl-image sdl-mixer pspirkeyb libpspvram libmodplug libvorbis jpeg libpng mpg123 flac
      - name: Build EBOOT
        run: |
          make clean || true
          make
          test -s EBOOT.PBP
          mkdir -p output/PSP/GAME/GUDFNF
          cp EBOOT.PBP output/PSP/GAME/GUDFNF/EBOOT.PBP
          cat > output/LEIA-ME.txt <<'EOF'
          GUD FNF PSP
          Copie a pasta PSP para a raiz do Memory Stick ou cartão usado pelo PPSSPP.
          Jogo: PSP/GAME/GUDFNF/EBOOT.PBP
          Recursos: coloque a pasta assets junto do EBOOT.PBP.
          Controles: CROSS inicia/reinicia, D-PAD acerta notas, START pausa, SELECT volta ao menu/sai.
          Chart incluído: Tutorial Remix.
          EOF
      - name: Upload compiled game files
        uses: actions/upload-artifact@v4
        with:
          name: compiled-psp-files
          path: output/
          if-no-files-found: error
